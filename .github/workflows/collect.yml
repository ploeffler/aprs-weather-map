name: Collect APRS weather
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: aprs-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect APRS-IS weather packets
        env:
          APRS_CALLSIGN: ${{ vars.APRS_CALLSIGN }}
          APRS_PASSCODE: ${{ secrets.APRS_PASSCODE }}
        run: python src/collector.py --duration 180
      - name: Generate temperature map
        run: python src/temperature_map.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/latest.json data/archive data/temperature.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update APRS weather snapshot"
            # Synchronize with code/documentation commits made during collection.
            # Rebase preserves the newly generated data without force-pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Generated data conflicts with newer repository changes"
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push detected (attempt $attempt/5), retrying"
              sleep 2
            done
            echo "::error::Could not publish APRS data after five attempts"
            exit 1
          fi
