name: Collect APRS weather
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: aprs-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect APRS-IS weather packets
        env:
          APRS_CALLSIGN: ${{ vars.APRS_CALLSIGN }}
          APRS_PASSCODE: ${{ secrets.APRS_PASSCODE }}
        run: python src/collector.py --duration 180
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || (git commit -m "Update APRS weather snapshot" && git push)
